name: Deploy theme

on:
  push:
    branches: [master]
    paths-ignore:
      - '**.md'
      - '.github/**'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: read

# Never run two deploys at once; a newer push waits for the running one.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  DEPLOY_HOST: 62.72.54.195
  DEPLOY_PORT: '65002'
  DEPLOY_USER: u759530778
  DEPLOY_PATH: domains/bitcoinveterans.org/public_html/wp-content/themes/bitcoin-veterans/
  SITE_URL: https://bitcoinveterans.org/

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up PHP 8.1 (matches server)
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: none
          coverage: none

      - name: Lint PHP
        run: |
          set -euo pipefail
          find . -path ./.git -prune -o -type f -name '*.php' -print0 \
            | xargs -0 -n1 -P4 php -l > /tmp/lint.log 2>&1 || { cat /tmp/lint.log; exit 1; }
          echo "Linted $(grep -c 'No syntax errors' /tmp/lint.log) PHP files."

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.BV_WEBSITE_DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Pinned host keys (from ssh-keyscan, verified against an existing trusted known_hosts entry).
          # ED25519 SHA256:oc6lOlMRuKvFmV0Qb6wfwvTjNojjaP+oi7ouh2sVP5k
          cat > ~/.ssh/known_hosts <<'EOF'
          [62.72.54.195]:65002 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIAz8xABX6G4ECx2XJXxbDLcn4A0rUEu4Ej5cwEb8CZ7R
          [62.72.54.195]:65002 ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBBFSP+bQvDS6loS5kYfcC3MF+/cvO8a5iSigkoYrBvdgmSeE7hdgS7Wnqm1z7u/bBSiMTa745tejy1bHXk///SY=
          [62.72.54.195]:65002 ssh-rsa 
          EOF
          sed -i 's/^ *//' ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Rsync theme to server
        run: |
          set -euo pipefail
          # No --delete: files removed from the repo must be removed on the server by hand.
          # -c: compare by checksum (checkout mtimes are always "now").
          rsync -rlcpz --chmod=D755,F644 --itemize-changes \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.gitignore' \
            --exclude='.editorconfig' \
            --exclude='.DS_Store' \
            --exclude='._*' \
            --exclude='.sass-cache/' \
            --exclude='node_modules/' \
            --exclude='src/' \
            --exclude='package.json' \
            --exclude='package-lock.json' \
            --exclude='gulpfile.js' \
            --exclude='*.md' \
            --exclude='*.map' \
            --exclude='*.code-workspace' \
            -e "ssh -i $HOME/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts -p $DEPLOY_PORT" \
            ./ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH"

      - name: Health check
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            code=$(curl -s -o /tmp/home.html -w '%{http_code}' --max-time 30 "${SITE_URL}?deploy=${GITHUB_SHA}-${attempt}" || true)
            if [ "$code" = "200" ] && ! grep -qiE 'critical error|Fatal error' /tmp/home.html; then
              echo "Site OK (HTTP $code)."
              exit 0
            fi
            echo "Attempt $attempt: HTTP $code"
            sleep 10
          done
          echo "::error::Health check failed for $SITE_URL"
          exit 1

      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
